<svg xmlns="http://www.w3.org/2000/svg" width="1223" height="575" viewBox="0 0 1223 575"><defs><marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#124a8f"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="12.0" y="20.0" width="570.0" height="436.0" rx="13.0" fill="#fff7eb" stroke="#df7b27" stroke-width="1.3"/>
<text x="42.0" y="66.9" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="24.7" font-weight="700" fill="#092b56">历史慢层搜索：独立评价链</text>
<text x="45.0" y="166.6" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.9" font-weight="400" fill="#000000">候选编码：PF 指数、连接数、调度阈值、rank 门限及修复参数等；不是正式场景的直接联合决策变量。</text>
<text x="45.0" y="302.1" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.9" font-weight="400" fill="#000000">GA 用选择、交叉、变异产生候选；PSO 用位置和速度更新候选；历史评价器计算目标并筛选。</text>
<rect x="643.0" y="20.0" width="566.0" height="436.0" rx="13.0" fill="#f4f9fd" stroke="#124a8f" stroke-width="1.3"/>
<text x="672.0" y="66.9" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="24.7" font-weight="700" fill="#092b56">当前正式快层：集中式求解</text>
<text x="675.0" y="162.2" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="21.1" font-weight="400" fill="#000000">规则固定：关联 b、调度 χ、流数 r、资源权重 ν；输入 Ĥ 与 C。</text>
<text x="675.0" y="291.2" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="21.1" font-weight="400" fill="#000000">优化：含发射幅度的预编码 w；跨资源组共享每 TRP 功率预算 Pₗ。</text>
<line x1="582.0" y1="227.0" x2="637.0" y2="227.0" stroke="#df7b27" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
<text x="600.5" y="275.7" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19.8" font-weight="700" fill="#df7b27">尚未接通</text>
<rect x="23.0" y="477.0" width="1177.0" height="59.0" rx="13.0" fill="#e0ecf6" stroke="#124a8f" stroke-width="1.3"/>
<text x="44.0" y="512.0" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.5" font-weight="700" fill="#000000">只有经过接入与统一评价，才能把“慢层候选 → 快层求解 → 反馈”称为当前联合链。</text></svg>