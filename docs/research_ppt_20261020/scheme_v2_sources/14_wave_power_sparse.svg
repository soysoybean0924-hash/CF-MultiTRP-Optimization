<text x="36.0" y="311.9" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.4" font-weight="400" fill="#000000">wₗₖg∈ℂ⁶⁴×ʳ；pₗ 是所有资源组的加权发射功率。</text>
<rect x="413.0" y="199.0" width="373.0" height="167.0" rx="13.0" fill="#f4f9fd" stroke="#1c7663" stroke-width="1.3"/>
<text x="436.0" y="238.0" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="23.4" font-weight="700" fill="#092b56">链路组 vs 整 TRP</text>
<text x="436.0" y="313.9" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.2" font-weight="400" fill="#000000">‖wₗₖ,:‖ 归零只删一条服务链；sₗ=0 才约束整台 TRP 不发射。</text>
