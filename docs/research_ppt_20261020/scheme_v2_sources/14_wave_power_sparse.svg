<text x="28.0" y="170.2" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="19.8" font-weight="400" fill="#000000">公平效用 − 链路组稀疏 − TRP 激活代价；分开两种惩罚系数是解释修正。</text>
<rect x="12.0" y="199.0" width="372.0" height="167.0" rx="13.0" fill="#f4f9fd" stroke="#124a8f" stroke-width="1.3"/>
