<text x="30.0" y="508.6" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="19.5" font-weight="700" fill="#000000">任务目标：边缘体验、体验损失 &lt;10%、空口发射功率降 &gt;30%；参照与分母须按原始材料核定，当前无新版效果证据。</text></svg>