<text x="840.0" y="313.9" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="20.2" font-weight="400" fill="#000000">边缘最低速率、关联可行性；sₗ 松弛判阈后须重优化并复查。</text>
