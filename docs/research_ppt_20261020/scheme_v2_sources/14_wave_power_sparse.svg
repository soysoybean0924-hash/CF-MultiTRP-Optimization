<svg xmlns="http://www.w3.org/2000/svg" width="1223" height="580" viewBox="0 0 1223 580"><defs><marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#124a8f"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="16.0" y="34.0" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="23.4" font-weight="700" fill="#092b56">完整波束 w 同时决定发射方向与幅度；功率 p 由波束范数导出。</text>
