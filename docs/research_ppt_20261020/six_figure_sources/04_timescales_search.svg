<svg xmlns="http://www.w3.org/2000/svg" width="1223" height="555" viewBox="0 0 1223 555"><defs><marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#124a8f"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="0.0" y="3.0" width="1223.0" height="40.0" rx="3.0" fill="#e0ecf6" stroke="#e0ecf6" stroke-width="1.3"/>
