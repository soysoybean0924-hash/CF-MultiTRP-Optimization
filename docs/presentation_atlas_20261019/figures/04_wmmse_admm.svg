   <g id="text_1">
    <text style="fill: #a81e22; font: 700 29px 'Microsoft YaHei'; text-anchor: start" x="177.48" y="112.292503" transform="rotate(-0 177.48 112.292503)">04  WMMSE—ADMM｜外层更新统计量，内层求满足功率约束的 w</text>
   </g>
   <g id="text_2">
    <text style="fill: #53677a; font: 13px 'Microsoft YaHei'; text-anchor: start" x="178.596" y="134.008078" transform="rotate(-0 178.596 134.008078)">矩阵 WMMSE 外轮与集中式 ADMM 内轮；以下为当前代码中的变量和停止判断</text>
   </g>
   <g id="text_3">
    <text style="fill: #17324d; font: 700 14px 'Microsoft YaHei'; text-anchor: start" x="190.314" y="550.083469" transform="rotate(-0 190.314 550.083469)">功率投影可行 ≠ ADMM 收敛；保存的正式规模轨迹仍达到外轮与内轮次数上限。</text>
   </g>
   <g id="text_4">
    <text style="fill: #53677a; font: 10px 'Microsoft YaHei'; text-anchor: end" x="993.834" y="548.981906" transform="rotate(-0 993.834 548.981906)">04 / 06</text>
   </g>
   <g id="text_5">
    <text style="fill: #246c9c; font: 700 17px 'Microsoft YaHei'; text-anchor: start" x="198.684" y="210.164813" transform="rotate(-0 198.684 210.164813)">外层｜给定 H_est 与误差统计 C</text>
   </g>
   <g id="text_6">
    <text style="fill: #17324d; font: 700 15px 'Microsoft YaHei'; text-anchor: start" x="211.518" y="255.972459" transform="rotate(-0 211.518 255.972459)">当前 w</text>
   </g>
   <g id="text_7">
    <text style="fill: #53677a; font: 11px 'Microsoft YaHei'; text-anchor: start" x="211.518" y="275.938097" transform="rotate(-0 211.518 275.938097)">初值 / 上轮结果</text>
   </g>
   <g id="text_8">
    <text style="fill: #17324d; font: 700 15px 'Microsoft YaHei'; text-anchor: start" x="361.062" y="255.972459" transform="rotate(-0 361.062 255.972459)">接收器 A</text>
   </g>
   <g id="text_9">
    <text style="fill: #53677a; font: 11px 'Microsoft YaHei'; text-anchor: start" x="361.062" y="275.938097" transform="rotate(-0 361.062 275.938097)">MMSE 更新</text>
   </g>
   <g id="text_10">
    <text style="fill: #17324d; font: 700 15px 'Microsoft YaHei'; text-anchor: start" x="526.788" y="255.972459" transform="rotate(-0 526.788 255.972459)">MSE E 与权重 Ω</text>
   </g>
   <g id="text_11">
    <text style="fill: #53677a; font: 11px 'Microsoft YaHei'; text-anchor: start" x="526.788" y="275.938097" transform="rotate(-0 526.788 275.938097)">由当前 A、w 得到</text>
   </g>
   <g id="text_12">
    <text style="fill: #17324d; font: 700 15px 'Microsoft YaHei'; text-anchor: start" x="715.392" y="255.972459" transform="rotate(-0 715.392 255.972459)">预编码子问题</text>
   </g>
   <g id="text_13">
    <text style="fill: #53677a; font: 11px 'Microsoft YaHei'; text-anchor: start" x="715.392" y="275.938097" transform="rotate(-0 715.392 275.938097)">固定 A、Ω；更新 w</text>
   </g>
   <g id="text_14">
    <text style="fill: #b97911; font: 700 14px 'Microsoft YaHei'; text-anchor: middle" x="937.476" y="255.142669" transform="rotate(-0 937.476 255.142669)">停止?</text>
   </g>
   <g id="text_15">
    <text style="fill: #53677a; font: 9px 'Microsoft YaHei'; text-anchor: middle" x="937.476" y="275.941716" transform="rotate(-0 937.476 275.941716)">目标 / w / 残差</text>
   </g>
   <g id="text_16">
    <text style="fill: #53677a; font: 11px 'Microsoft YaHei'; text-anchor: start" x="722.646" y="311.974097" transform="rotate(-0 722.646 311.974097)">未满足则回到外层；满足并需 ADMM 收敛</text>
   </g>
   <g id="text_17">
    <text style="fill: #117a70; font: 700 17px 'Microsoft YaHei'; text-anchor: start" x="198.684" y="380.42405" transform="rotate(-0 198.684 380.42405)">内层 ADMM｜仅优化复预编码 w，A / Ω 保持固定</text>
   </g>
   <g id="text_18">
    <text style="fill: #17324d; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="209.844" y="432.688364" transform="rotate(-0 209.844 432.688364)">CG 线性系统</text>
   </g>
   <g id="text_19">
    <text style="fill: #53677a; font: 10.5px 'Microsoft YaHei'; text-anchor: start" x="209.844" y="452.654002" transform="rotate(-0 209.844 452.654002)">更新 x</text>
   </g>
   <g id="text_20">
    <text style="fill: #17324d; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="393.426" y="432.688364" transform="rotate(-0 393.426 432.688364)">跨资源功率投影</text>
   </g>
   <g id="text_21">
    <!-- $z=\Pi_{\mathcal{P}}(x+u)$ -->
    <g style="fill: #53677a" transform="translate(393.426 452.654002)">
     <text>
      <tspan style="font: oblique 10.5px 'DejaVu Sans'" x="0 35.701089 54.804117" y="-0.65625">zxu</tspan>
      <tspan style="font: 10.5px 'DejaVu Sans'" x="7.557129 18.400635 31.604654 43.960611 61.458902" y="-0.65625">=Π(+)</tspan>
      <tspan style="font: italic 7.35px 'STIXNonUnicode'" x="26.401416" y="1.1484375"></tspan>
     </text>
    </g>
   </g>
   <g id="text_22">
    <text style="fill: #17324d; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="576.45" y="432.688364" transform="rotate(-0 576.45 432.688364)">缩放对偶</text>
   </g>
   <g id="text_23">
    <!-- $u\leftarrow u+x-z$ -->
    <g style="fill: #53677a" transform="translate(576.45 452.654002)">
     <text>
      <tspan style="font: oblique 10.5px 'DejaVu Sans'" x="0 19.543945 39.087891 58.190918" y="-0.109375">uuxz</tspan>
      <tspan style="font: 10.5px 'DejaVu Sans'" x="8.700439 28.244385 47.347412" y="-0.109375">←+−</tspan>
     </text>
    </g>
   </g>
   <g id="text_24">
    <text style="fill: #17324d; font: 700 14.5px 'Microsoft YaHei'; text-anchor: start" x="743.292" y="432.688364" transform="rotate(-0 743.292 432.688364)">残差判断</text>
   </g>
   <g id="text_25">
    <text style="fill: #53677a; font: 10.5px 'Microsoft YaHei'; text-anchor: start" x="743.292" y="452.654002" transform="rotate(-0 743.292 452.654002)">原始 / 对偶 / CG；或达到上限</text>
   </g>
   <g id="text_26">
    <text style="fill: #53677a; font: 11.5px 'Microsoft YaHei'; text-anchor: start" x="202.59" y="486.747792" transform="rotate(-0 202.59 486.747792)">功率预算按 TRP 跨资源组累计；ADMM 变量均在同一 MATLAB 进程内。</text>
   </g>
  </g>
 </g>
