   <g id="text_1">
    <text style="fill: #a81e22; font: 700 29px 'Microsoft YaHei'; text-anchor: start" x="177.48" y="112.292503" transform="rotate(-0 177.48 112.292503)">05  非均匀鲁棒机制｜从链路测量质量，到可信赋形</text>
   </g>
   <g id="text_2">
    <text style="fill: #53677a; font: 13px 'Microsoft YaHei'; text-anchor: start" x="178.596" y="134.008078" transform="rotate(-0 178.596 134.008078)">当前已实现的是链路条件误差协方差参与计算；校准椭球与最坏情况保证仍待研究</text>
   </g>
   <g id="text_3">
    <text style="fill: #17324d; font: 700 14px 'Microsoft YaHei'; text-anchor: start" x="190.314" y="550.083469" transform="rotate(-0 190.314 550.083469)">要证明创新效果，需同场景、同业务、同功率约束、同随机种子比较名义/统一/非均匀三种设定。</text>
   </g>
   <g id="text_4">
    <text style="fill: #53677a; font: 10px 'Microsoft YaHei'; text-anchor: end" x="993.834" y="548.981906" transform="rotate(-0 993.834 548.981906)">05 / 06</text>
   </g>
   <g id="text_5">
    <text style="fill: #117a70; font: 700 17px 'Microsoft YaHei'; text-anchor: start" x="187.524" y="176.689641" transform="rotate(-0 187.524 176.689641)">当前可追溯的统计链</text>
   </g>
   <g id="text_6">
