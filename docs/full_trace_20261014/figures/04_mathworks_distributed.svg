<rect x="45" y="982" width="1810" height="68" rx="10" fill="#e6edf6"/><text x="60" y="1024" font-family="Microsoft YaHei" font-size="19" fill="#203344">O04 W_k=stack_m W_mk；O05 X_m=sum_k X_mk；O06 LLR_k=sum_m LLR_mk；W 在 CPU 计算，AP 应用</text></svg>